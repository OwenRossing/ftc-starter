# Settings for the sim (the sim/ folder). It only reads this file, the robot app never does.

# Which robot the sim drives. "starter" is goBILDA's StarterBot with mecanum wheels (START_HERE.md lists its parts),
# "starter-tank" is the 6 wheel tank version (its names are left_drive, right_drive and windmill).
robot=starter

# localhost keeps the sim's page to this computer. Delete this line to open it from a phone on the same Wi-Fi.
host=localhost
