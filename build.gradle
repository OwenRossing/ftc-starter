/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
}

plugins {
    // Note for FTC Teams: Do not modify this yourself.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()
}

// Run in Sim: runs TeamCode in the 3D sim in your browser instead of on a robot. The sim is its own build
// in sim/ (a git submodule), so it can never break the robot build. See START_HERE.md
tasks.register('runSim', GradleBuild) {
    group = 'sim'
    description = 'Runs TeamCode in the 3D sim, in your browser'
    dir = file('sim')
    tasks = ['run']
    doFirst {
        if (!file('sim/build.gradle').exists()) {
            throw new GradleException('The sim/ folder is empty. Run: git submodule update --init')
        }
    }
}
